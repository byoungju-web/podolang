name = "podolang"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[placement]
mode = "smart"

# 비밀이 아닌 값만 여기 둡니다.
# 대시보드에 Text(Plaintext) 로 넣으면 배포할 때마다 wrangler 가 지워버립니다.
# (Secret 은 안 지워집니다 — 그래서 키들은 대시보드에 그대로 둡니다)
#
# ⚠️ [vars] 는 이 파일에 딱 한 번만 씁니다.
#    두 번 쓰면 뒤엣것만 남고 앞엣것이 통째로 사라져 배포가 깨집니다.
[vars]
TALK_API = "https://podotalk-api.hasin7jk.workers.dev"

# ⚠️ 아래 값들은 절대 여기에 쓰지 마세요. 이 파일은 GitHub 에 남습니다.
#    OPENAI_API_KEY / DEEPL_API_KEY / ELEVENLABS_API_KEY
#    TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / LINK_KEY
#    → Cloudflare 대시보드에서 Secret 으로 넣으세요.

[[kv_namespaces]]
binding = "PODOLANG_KV"
id = "476d9f97ec1b45aa956dc2b36e0a003a"


