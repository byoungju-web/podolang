name = "podolang"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[placement]
mode = "smart"

# ⚠️ [vars] 는 이 파일에 딱 한 번만 씁니다.
#    두 번 쓰면 뒤엣것만 남고 앞엣것이 통째로 사라져 배포가 깨집니다.
[vars]
TALK_API = "https://podotalk-api.hasin7jk.workers.dev"

# LINK_KEY 를 여기 둡니다.
#
# 원래는 대시보드에 Secret 으로 넣는 게 맞습니다. 그런데 이 워커는 GitHub 에서
# 배포되고, wrangler 는 배포할 때마다 파일에 없는 값을 걷어냅니다.
# 그래서 넣어도 다음 배포에 사라져 크레딧 확인이 계속 끊겼습니다.
#
# 이 값은 서버끼리 서로를 알아보는 문일 뿐입니다. 이걸 안다고 남의 크레딧을
# 보거나 깎을 수는 없습니다 (uid 를 알아야 하고, 그 uid 의 잔액만 다룹니다).
# 그래도 신경 쓰이면 저장소를 Private 으로 바꾸시면 됩니다.
#
# ★ 세 워커(podotalk-api / podolang / podolang-realtime)가 모두 같은 값이어야 합니다.
LINK_KEY = "podo-link-9f3a2b7c1d8e5415"

# ⚠️ 아래 값들은 절대 여기에 쓰지 마세요. 진짜 비밀입니다.
#    OPENAI_API_KEY / DEEPL_API_KEY / ELEVENLABS_API_KEY
#    TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN
#    → Cloudflare 대시보드에서 Secret 으로 넣으세요.

[[kv_namespaces]]
binding = "PODOLANG_KV"
id = "476d9f97ec1b45aa956dc2b36e0a003a"

# 포도톡 워커를 직접 부르는 길입니다.
# 같은 계정의 워커를 workers.dev 주소로 부르면 Cloudflare 가 막습니다
# (error code 1042). 이 연결을 쓰면 주소를 거치지 않아 막히지 않습니다.
[[services]]
binding = "TALK"
service = "podotalk-api"
